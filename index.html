<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GR Consultoria Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho e Call to Action -->
    <header>
        <div class="container">
            <h1>GR Consultoria Digital</h1>
            <p>Soluções inteligentes e gestão de dados para alavancar os processos do seu negócio.</p>
            <button id="btnCta">Agendar Consultoria</button>
        </div>
    </header>

    <!-- Área de Contato e Integração ViaCEP -->
    <section id="contato">
        <div class="container">
            <h2>Entre em Contato</h2>
            <p>Preencha os dados abaixo e entraremos em contato.</p>
            
            <form id="formContato">
                <input type="text" id="nome" placeholder="Seu Nome Completo" required>
                <input type="email" id="email" placeholder="Seu E-mail" required>
                
                <!-- Campos para a API do ViaCEP -->
                <div class="cep-group">
                    <input type="text" id="cep" placeholder="CEP (Somente números)" maxlength="8" required>
                </div>
                <input type="text" id="rua" placeholder="Rua" disabled>
                <input type="text" id="cidade" placeholder="Cidade" disabled>
                <input type="text" id="estado" placeholder="Estado (UF)" disabled>

                <textarea id="mensagem" placeholder="Descreva brevemente sua necessidade..." required></textarea>
                
                <button type="submit" id="btnSubmit">Enviar Mensagem</button>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
